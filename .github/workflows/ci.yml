name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    name: Application and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: bot_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: valkyria_bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bot_test -d valkyria_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bot_test:synthetic-ci-only@127.0.0.1:5432/valkyria_bot_test
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record tested revision
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          writeFileSync('test-results/revision.json', JSON.stringify({
            testedSha: execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(),
            prHead: process.env.PR_HEAD || null, eventSha: process.env.EVENT_SHA,
            environment: 'GitHub Actions with disposable PostgreSQL; no live integrations',
          }, null, 2));
          NODE
      - name: Repository hygiene
        run: pnpm check:repository
      - name: Presskit integrity regression fixtures
        run: node --test scripts/tests/presskit.node.mjs
      - name: Curated simulation evidence provenance
        run: pnpm check:evidence
      - name: Curated extension evidence provenance
        run: pnpm check:extensions-evidence
      - name: Commit attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            pnpm check:commits "$BASE_SHA..$HEAD_SHA"
          else
            pnpm check:commits "$HEAD_SHA"
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and real local transport tests
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Real PostgreSQL transaction tests
        run: pnpm test:integration --reporter=default --reporter=junit --outputFile.junit=test-results/postgres.xml
      - run: pnpm build
      - name: Offline synthetic demonstration
        shell: bash
        run: |
          set -euo pipefail
          pnpm demo | tee test-results/synthetic-demo.txt
      - name: Offline registration manifest
        shell: bash
        env:
          BOT_CONFIG_FILE: config/bot.example.json
        run: |
          set -euo pipefail
          pnpm commands:register | tee test-results/command-manifest.txt
      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record container source revision
        id: container-source
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const testedSha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          assert.match(testedSha, /^[0-9a-f]{40}$/);
          assert.equal(testedSha, process.env.EVENT_SHA);
          const hash = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          writeFileSync('test-results/container-source.json', JSON.stringify({
            testedSha, prHead: process.env.PR_HEAD || null, eventSha: process.env.EVENT_SHA,
            dockerfileSha256: hash('Dockerfile'), lockfileSha256: hash('pnpm-lock.yaml'),
            environment: 'GitHub Actions; local image build and offline smoke; no registry publication',
          }, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${testedSha}\n`);
          NODE
      - name: Set up the isolated Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and load production image without publication
        id: container-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Keep proof in the explicit 14-day artifact below; no implicit .dockerbuild upload.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: valkyria-bot:ci
          build-args: REVISION=${{ steps.container-source.outputs.sha }}
          # The local Docker exporter does not retain registry attestations.
          provenance: false
          sbom: false
      - name: Verify loaded image identity and retain build proof
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.container-source.outputs.sha }}
          IMAGE_ID: ${{ steps.container-image.outputs.imageid }}
          IMAGE_DIGEST: ${{ steps.container-image.outputs.digest }}
          BUILD_METADATA: ${{ steps.container-image.outputs.metadata }}
        run: |
          set -euo pipefail
          docker buildx version >test-results/container-builder.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const image = JSON.parse(execFileSync('docker', ['image', 'inspect', 'valkyria-bot:ci'], {encoding:'utf8'}))[0];
          const metadata = JSON.parse(process.env.BUILD_METADATA);
          assert.match(process.env.IMAGE_ID, /^sha256:[0-9a-f]{64}$/);
          assert.match(process.env.IMAGE_DIGEST, /^sha256:[0-9a-f]{64}$/);
          assert.equal(image.Id, process.env.IMAGE_ID);
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'], process.env.SOURCE_SHA);
          assert.equal(image.Os, 'linux');
          assert.equal(image.Architecture, 'amd64');
          writeFileSync('test-results/container-build.json', JSON.stringify({
            testedSha: process.env.SOURCE_SHA,
            action: 'docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc',
            imageId: image.Id, digest: process.env.IMAGE_DIGEST,
            buildRef: metadata['buildx.build.ref'] || null,
            platform: `${image.Os}/${image.Architecture}`, configuredUser: image.Config.User,
            push: false, load: true, liveIntegration: false,
            buildLog: 'GitHub Actions: Build and load production image without publication',
          }, null, 2));
          NODE
      - name: Verify non-root offline health and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name valkyria-bot-ci --network none --read-only --cap-drop ALL --security-opt no-new-privileges --init valkyria-bot:ci --offline
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec valkyria-bot-ci node -e "fetch('http://127.0.0.1:3000/health/live',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec valkyria-bot-ci node --input-type=module -e '
            import assert from "node:assert/strict";
            assert.notEqual(process.getuid(), 0);
            const live = await fetch("http://127.0.0.1:3000/health/live");
            assert.equal(live.status, 200);
            assert.deepEqual(await live.json(), {status:"alive", mode:"offline"});
            const ready = await fetch("http://127.0.0.1:3000/health/ready");
            assert.equal(ready.status, 503);
            assert.deepEqual(await ready.json(), {status:"unavailable", mode:"offline"});
            console.log(JSON.stringify({uid:process.getuid(),liveness:200,readiness:503,mode:"offline",liveIntegration:false}));
          ' | tee test-results/container-health.json
          docker stop --time 25 valkyria-bot-ci
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' valkyria-bot-ci)"
          printf '{"exitCode":%s,"stopTimeoutSeconds":25}\n' "$exit_code" >test-results/container-shutdown.json
          test "$exit_code" = 0
      - name: Collect logs and remove fixture
        if: always()
        run: |
          mkdir -p test-results
          if docker container inspect valkyria-bot-ci >/dev/null 2>&1; then
            docker logs valkyria-bot-ci >test-results/container-runtime.txt 2>&1
            docker rm --force valkyria-bot-ci
          fi
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  simulation:
    name: Simulated Discord E2E and browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: bot_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: valkyria_bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bot_test -d valkyria_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAB_DATABASE_URL: postgresql://bot_test:synthetic-ci-only@127.0.0.1:5432/valkyria_bot_test
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real application chain with fictitious Discord and provider data
        run: pnpm test:e2e --reporter=default --reporter=junit --outputFile.junit=.local/lab/e2e.xml
      - name: Generate a fresh report through the public lab CLI
        run: pnpm lab:run
      - name: Generate extension publication and signup evidence
        run: pnpm lab:extensions
      - name: Browser smoke and simulation captures across five fresh runs (no retries)
        run: pnpm test:visual --repeat-each=5
      - name: Upload simulation proof and browser failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/lab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality gate
    needs: [application, container, simulation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require application, container and simulation success
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          SIMULATION_RESULT: ${{ needs.simulation.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$CONTAINER_RESULT" = success
          test "$SIMULATION_RESULT" = success
